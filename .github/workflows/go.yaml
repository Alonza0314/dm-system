name: Go

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: [ '1.26.2' ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Build
        run: cd backend && go build -v ./...

      - name: Test
        run: cd backend && go test -v ./...

      - name: Make Backend
        run: make

      - name: Tool build
        run: cd tool && go build -v ./...

      - name: Tool test
        run: cd tool && go test -v ./...

      - name: Tool make
        run: cd tool && make